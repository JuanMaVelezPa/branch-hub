spring.application.name=spring-web
logging.config=classpath:logback-spring.xml
logging.file.path=${LOG_PATH:logs}
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.jm.spring_web=${APP_LOG_LEVEL:INFO}
logging.level.com.jm.spring_web.infrastructure.logging.RequestAccessLogFilter=${HTTP_ACCESS_LOG_LEVEL:INFO}
logging.level.org.apache.kafka=${KAFKA_LOG_LEVEL:WARN}
logging.level.org.springframework.kafka=${SPRING_KAFKA_LOG_LEVEL:WARN}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/companydb}
spring.datasource.username=${DB_USERNAME:company}
spring.datasource.password=${DB_PASSWORD:company}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:2147483647}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:rrhh-notifier}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.isolation.level=read_committed

app.kafka.topics.hr-notifications=${KAFKA_HR_TOPIC:hr-new-branch-notifications}
app.notifications.enabled=${APP_NOTIFICATIONS_ENABLED:true}
app.outbox.relay.fixed-delay-ms=${OUTBOX_RELAY_DELAY_MS:5000}
app.kafka.hr-consumer.retry-attempts=${KAFKA_HR_RETRY_ATTEMPTS:4}
app.kafka.hr-consumer.retry-delay-ms=${KAFKA_HR_RETRY_DELAY_MS:1000}
app.kafka.hr-consumer.retry-multiplier=${KAFKA_HR_RETRY_MULTIPLIER:2.0}
app.kafka.hr-consumer.retry-max-delay-ms=${KAFKA_HR_RETRY_MAX_DELAY_MS:30000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
app.security.actuator-public=${APP_SECURITY_ACTUATOR_PUBLIC:true}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:REFRESH_TOKEN}
security.jwt.mfa-challenge-expiration-seconds=${JWT_MFA_CHALLENGE_SECONDS:300}
security.cookies.secure=${SECURITY_COOKIES_SECURE:false}

# MFA (TOTP) for SUPER_ADMIN / APP_ADMIN — AES-256 key Base64 (32 bytes). Required to enroll or verify TOTP.
security.mfa.encryption-key-base64=${IAM_MFA_ENCRYPTION_KEY:}
security.mfa.issuer=${IAM_MFA_ISSUER:${spring.application.name}}

# IAM3 — rate limit auth endpoints per client IP (Caffeine per JVM by default; Redis when redis-enabled=true — see docs/auth/iam3-refresh-opaco-y-rate-limit.md)
security.auth-rate-limit.enabled=${SECURITY_AUTH_RATE_LIMIT_ENABLED:true}
security.auth-rate-limit.redis-enabled=${SECURITY_AUTH_RATE_LIMIT_REDIS_ENABLED:false}
security.auth-rate-limit.redis-key-prefix=${SECURITY_AUTH_RATE_LIMIT_REDIS_KEY_PREFIX:auth:rl:}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
security.auth-rate-limit.login-max-requests=${SECURITY_AUTH_RATE_LIMIT_LOGIN_MAX:30}
security.auth-rate-limit.login-window=${SECURITY_AUTH_RATE_LIMIT_LOGIN_WINDOW:PT1M}
security.auth-rate-limit.login-identifier-max-requests=${SECURITY_AUTH_RATE_LIMIT_LOGIN_IDENTIFIER_MAX:30}
security.auth-rate-limit.login-identifier-window=${SECURITY_AUTH_RATE_LIMIT_LOGIN_IDENTIFIER_WINDOW:PT1M}
security.auth-rate-limit.refresh-max-requests=${SECURITY_AUTH_RATE_LIMIT_REFRESH_MAX:120}
security.auth-rate-limit.refresh-window=${SECURITY_AUTH_RATE_LIMIT_REFRESH_WINDOW:PT1M}
security.auth-rate-limit.cache-max-entries=${SECURITY_AUTH_RATE_LIMIT_CACHE_MAX:50000}
security.auth-rate-limit.cache-expire-after-access=${SECURITY_AUTH_RATE_LIMIT_CACHE_TTL:PT10M}

# IAM3 — periodic purge of expired opaque refresh rows (Spring cron: second minute hour day month weekday)
security.refresh-session.cleanup.enabled=${SECURITY_REFRESH_SESSION_CLEANUP_ENABLED:true}
security.refresh-session.cleanup.cron=${SECURITY_REFRESH_SESSION_CLEANUP_CRON:0 0 * * * *}

# IAM transactional email outbox (table iam_email_outbox, Thymeleaf templates under templates/email/). Requires spring.mail.host when enabled.
app.iam.email.enabled=${IAM_EMAIL_ENABLED:false}
app.iam.email.from-address=${IAM_EMAIL_FROM:noreply@localhost}
app.iam.email.relay-delay-ms=${IAM_EMAIL_RELAY_DELAY_MS:5000}
app.iam.email.batch-size=${IAM_EMAIL_BATCH_SIZE:50}
app.iam.email.max-attempts=${IAM_EMAIL_MAX_ATTEMPTS:5}
# spring.mail.host must be set (e.g. smtp.gmail.com) when IAM_EMAIL_ENABLED=true
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# IAM1 bootstrap (first admin account, seeded on startup if missing).
app.security.bootstrap.enabled=${APP_IAM_BOOTSTRAP_ENABLED:true}
app.security.bootstrap.super-admin.email=${APP_SUPER_ADMIN_EMAIL:admin@example.com}
# Default matches root `.env.example` so local runs without exporting a password match documented login.
app.security.bootstrap.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:Admin_ChangeMe_2026!}

# IAM1 — lockout after repeated failed password logins (per account in iam_user).
app.security.login.max-failed-attempts=${APP_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lockout-minutes=${APP_LOGIN_LOCKOUT_MINUTES:15}
