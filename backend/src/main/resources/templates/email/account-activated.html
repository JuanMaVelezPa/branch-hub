<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title}">Account active</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; color: #1a1a1a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; margin: 0 auto;">
    <tr>
      <td style="padding: 24px 16px;">
        <h1 style="font-size: 20px; margin: 0 0 16px 0;" th:text="${title}">Title</h1>
        <p style="margin: 0 0 12px 0;" th:text="${lead}">Lead paragraph.</p>
        <p style="margin: 0; font-size: 14px; color: #444;" th:if="${detail != null}" th:text="${detail}">Optional detail.</p>
        <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 24px 0;"/>
        <p style="margin: 0; font-size: 12px; color: #666;">This message was sent by your application security service. If you did not expect it, contact your administrator.</p>
      </td>
    </tr>
  </table>
</body>
</html>
