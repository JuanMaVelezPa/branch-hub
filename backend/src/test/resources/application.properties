security.jwt.secret=test-secret-test-secret-test-secret-123
security.jwt.expiration-seconds=3600
security.jwt.refresh-expiration-seconds=1209600
security.jwt.refresh-cookie-name=REFRESH_TOKEN
security.jwt.mfa-challenge-expiration-seconds=300
# 32-byte test key (ASCII "0123456789abcdef0123456789abcdef") — tests only
security.mfa.encryption-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.mfa.issuer=spring-web-test
security.auth-rate-limit.enabled=false
security.refresh-session.cleanup.enabled=false
app.iam.email.enabled=false
app.notifications.enabled=false

# IAM1: keep tests deterministic (seed SUPER_ADMIN if missing)
app.security.bootstrap.enabled=true
app.security.bootstrap.super-admin.email=admin
app.security.bootstrap.super-admin.password=admin123
