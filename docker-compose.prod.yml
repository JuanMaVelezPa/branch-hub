# Prod overlay: the published server stack (code-branchhub.jotaeme.dev).
# On the server, `.env` sets COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml,
# so a plain `docker compose up -d` always deploys this overlay.
# Requires the external `edge` network (created by the jotaeme-ingress stack).
services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: docker,prod
      # Private network only: the API is not on `edge` and nginx returns 404 for /actuator/* except health.
      APP_SECURITY_ACTUATOR_PUBLIC: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      SECURITY_COOKIES_SECURE: "true"
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"

  web:
    networks: [default, edge]

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required in .env.prod}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required in .env.prod}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:?GRAFANA_PUBLIC_URL is required in .env.prod}
      # Public read-only dashboards: anonymous Viewer, no login form, no sign-up.
      # The admin account stays configured for grafana-cli through docker exec.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks: [default, edge]

networks:
  edge:
    external: true
