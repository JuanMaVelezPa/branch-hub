<div class="flex flex-col gap-5">
  <app-admin-subnav />
  <h1 class="text-2xl font-semibold">{{ i18n.t('adminRolesTitle') }}</h1>

  <app-inline-alert [message]="error()" variant="error" [title]="i18n.t('rolesLoadFailed')" />

  <app-loading-state [active]="loading()" [label]="i18n.t('loadingRoles')" size="md" skeleton="table" />

  @if (!loading()) {
    @if (roles().length === 0) {
      <div class="rounded-box border border-rule bg-surface p-6">
        {{ i18n.t('emptyRoles') }}
      </div>
    } @else {
      <div class="overflow-x-auto rounded-box border border-rule bg-surface">
        <table class="table">
          <thead>
            <tr class="border-rule bg-paper text-base-content">
              <th scope="col">{{ i18n.t('name') }}</th>
              <th scope="col">{{ i18n.t('roleId') }}</th>
            </tr>
          </thead>
          <tbody>
            @for (r of roles(); track r.id) {
              <tr class="border-rule">
                <td class="font-semibold">{{ r.name }}</td>
                <td class="text-sm text-base-content/80 tabular-nums">{{ r.id }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  }
</div>
