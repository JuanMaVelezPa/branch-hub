<div class="grid min-h-dvh bg-paper md:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
  <!-- Brand panel (md and up): the one bold element. -->
  <!-- Pinned to the viewport height: the drawing takes whatever space the logo and tagline leave, so the
       panel never forces a page scroll (longer taglines, e.g. es, just shrink the drawing a little). -->
  <section
    class="sticky top-0 hidden h-dvh flex-col gap-6 border-r border-rule bg-surface p-8 md:flex lg:gap-8 lg:p-12"
    [attr.aria-label]="i18n.t('brandName')"
  >
    <app-logo class="shrink-0" sizeClass="h-9 w-9 text-primary" [wordmark]="true" [label]="i18n.t('brandName')" />
    <app-route-map-art class="min-h-0 flex-1" />
    <p class="max-w-md shrink-0 text-xl text-balance">{{ i18n.t('loginTagline') }}</p>
  </section>

  <!-- Form column. -->
  <div class="flex min-h-dvh flex-col pt-[env(safe-area-inset-top,0px)]">
    <div class="flex items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <app-logo class="md:invisible" sizeClass="h-8 w-8 text-primary" [wordmark]="true" [label]="i18n.t('brandName')" />
      <app-settings-dropdown />
    </div>

    <main class="flex flex-1 items-center justify-center px-4 py-8 sm:px-6">
      <div class="w-full max-w-sm">
        <div class="rounded-box border border-rule bg-surface p-6 sm:p-8">
          <h1 class="mb-6 text-2xl font-semibold">{{ i18n.t('loginTitle') }}</h1>
          @if (sessionNotice() || error()) {
            <div class="mb-4 flex flex-col gap-3">
              <app-inline-alert [message]="sessionNotice()" variant="info" [title]="i18n.t('sessionTitle')" />
              <app-inline-alert [message]="error()" variant="error" [title]="i18n.t('signInFailed')" />
            </div>
          }
          <app-busy-section [busy]="submitting()" [label]="i18n.t('signingIn')" spinnerSize="sm">
            <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
              <label class="flex flex-col gap-1.5">
                <span class="text-sm font-semibold">{{ i18n.t('username') }}</span>
                <input
                  class="input w-full"
                  type="email"
                  formControlName="username"
                  autocomplete="email"
                  data-testid="login-username"
                />
              </label>
              <label class="flex flex-col gap-1.5">
                <span class="text-sm font-semibold">{{ i18n.t('password') }}</span>
                <input
                  class="input w-full"
                  type="password"
                  formControlName="password"
                  autocomplete="current-password"
                  data-testid="login-password"
                />
              </label>
              <button
                type="submit"
                class="btn btn-primary mt-2 gap-2"
                [disabled]="form.invalid || submitting()"
                data-testid="login-submit"
              >
                @if (submitting()) {
                  <app-loading-spinner size="xs" />
                }
                {{ i18n.t('login') }}
              </button>
            </form>
          </app-busy-section>
        </div>
      </div>
    </main>

    <app-footer />
  </div>
</div>
