<div class="flex max-w-lg flex-col gap-5">
  <a [routerLink]="branchId() ? ['/branches', branchId()!] : ['/branches']" class="w-fit text-sm text-primary underline underline-offset-4 hover:decoration-2 focus-visible:rounded-field focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">{{
    i18n.t('back')
  }}</a>
  <h1 class="text-2xl font-semibold">{{ i18n.t('editBranchTitle') }}</h1>

  <app-inline-alert [message]="loadError()" variant="error" [title]="i18n.t('branchLoadFailed')" />
  <app-inline-alert [message]="saveError()" variant="error" [title]="i18n.t('updateFailed')" />

  <app-loading-state [active]="loading()" [label]="i18n.t('loadingBranch')" size="md" skeleton="form" />

  @if (!loading() && !loadError()) {
    <app-busy-section class="rounded-box" [busy]="saving()" [label]="i18n.t('savingChanges')" spinnerSize="sm">
      <form
        class="flex flex-col gap-4 rounded-box border border-rule bg-surface p-6"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        <div class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">{{ i18n.t('code') }}</span>
          <p class="flex h-10 items-center rounded-field border border-rule bg-paper px-3 tabular-nums">
            {{ code() }}
          </p>
          <span class="text-sm text-base-content/80">{{ i18n.t('codeReadOnlyHint') }}</span>
        </div>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">{{ i18n.t('name') }}</span>
          <input class="input w-full" formControlName="name" data-testid="branch-edit-name" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold">{{ i18n.t('city') }}</span>
          <input class="input w-full" formControlName="city" data-testid="branch-edit-city" />
        </label>
        <div class="mt-2">
          <button
            type="submit"
            class="btn btn-primary gap-2"
            [disabled]="form.invalid || saving()"
            data-testid="branch-edit-submit"
          >
            @if (saving()) {
              <app-loading-spinner size="xs" />
            }
            {{ i18n.t('saveChanges') }}
          </button>
        </div>
      </form>
    </app-busy-section>
  }
</div>
