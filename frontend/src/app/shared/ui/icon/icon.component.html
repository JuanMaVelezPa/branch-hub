<svg
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  viewBox="0 0 24 24"
  stroke-width="1.5"
  stroke="currentColor"
  [class]="sizeClass()"
  aria-hidden="true"
  focusable="false"
>
  @for (d of paths(); track $index) {
    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="d" />
  }
</svg>
