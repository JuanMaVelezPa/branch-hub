<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
  <p class="text-sm text-base-content/80 tabular-nums" aria-live="polite">{{ summary() }}</p>
  <div class="flex flex-wrap items-center gap-3">
    <label class="flex items-center gap-2 text-sm">
      <span>{{ i18n.t('perPage') }}</span>
      <select
        class="h-8 rounded-field border border-rule bg-surface px-2 text-sm tabular-nums focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        [value]="pageSize()"
        (change)="onSizeChange($event)"
      >
        @for (opt of sizeOptions(); track opt) {
          <option [value]="opt" [selected]="opt === pageSize()">{{ opt }}</option>
        }
      </select>
    </label>
    <div class="flex gap-1">
      <button
        type="button"
        class="btn btn-sm border-rule bg-surface"
        [disabled]="!canPrev()"
        (click)="prev()"
      >
        {{ i18n.t('prev') }}
      </button>
      <button
        type="button"
        class="btn btn-sm border-rule bg-surface"
        [disabled]="!canNext()"
        (click)="next()"
      >
        {{ i18n.t('next') }}
      </button>
    </div>
  </div>
</div>
